<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Laporan Kegiatan / Visum Pengawasan</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-dark: #1557b0;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #dadce0;
            --text-main: #202124;
            --text-secondary: #5f6368;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* Login Screen Styles */
        #login-section {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .error-msg {
            color: #d93025;
            font-size: 13px;
            margin-top: 5px;
            text-align: center;
        }

        /* App Section Styles */
        #app-section {
            display: none;
        }

        .header-app {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .user-info {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .btn-logout {
            background: #d93025;
            width: auto;
            padding: 6px 14px;
            font-size: 13px;
        }
        .btn-logout:hover {
            background: #b31412;
        }

        .report-title {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* Tabel Sesuai Template Visum Pengawasan */
        .report-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        .report-table th, .report-table td {
            border: 1px solid #333;
            padding: 10px 12px;
            font-size: 14px;
            vertical-align: top;
        }

        .report-table td.label-cell {
            font-weight: 600;
            width: 22%;
            background: #f9f9f9;
        }

        .report-table td.input-cell {
            width: 28%;
        }

        .section-heading {
            font-weight: bold;
            font-size: 15px;
            margin: 25px 0 10px 0;
            color: #333;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        /* Pengaturan Layout Foto Dokumentasi */
        .photo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
        }

        .photo-card {
            text-align: center;
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: 8px;
            background: #fafafa;
        }

        .photo-card img {
            display: block;
            margin: 0 auto;
            border-radius: 4px;
            object-fit: contain;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .btn-print {
            background-color: #34a853;
        }
        .btn-print:hover {
            background-color: #2e8b57;
        }

        /* CSS khusus saat Cetak/Save to PDF */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .no-print {
                display: none !important;
            }
            input, textarea {
                border: none;
                background: transparent;
                padding: 0;
                resize: none;
            }
        }
    </style>
</head>
<body>

    <div id="login-section">
        <h2>🔐 Login Sistem</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" id="username" required placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>
            <button type="submit">Masuk</button>
            <div id="loginError" class="error-msg"></div>
            <p style="text-align: center; font-size: 12px; margin-top: 15px; color: #666;">
                Akun Demo: <b>admin</b> / <b>admin123</b><br>(Atau integrasikan via API Google Sheets Anda)
            </p>
        </form>
    </div>

    <div id="app-section" class="container">
        <div class="header-app no-print">
            <div class="user-info">👤 Petugas Login: <b id="displayUser">Admin</b></div>
            <button class="btn-logout" onclick="handleLogout()">Logout</button>
        </div>
