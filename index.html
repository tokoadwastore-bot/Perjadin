<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Layanan BPS - Sensus & Laporan</title>
    <!-- Tailwind CSS untuk styling yang rapi dan responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans text-slate-800">

    <!-- Header / Navbar -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-wide">Portal Aplikasi Pendataan</h1>
            <div id="userSession" class="text-sm hidden">
                Halo, <span id="sessionName" class="font-semibold underline"></span> 
                <button onclick="logout()" class="ml-3 bg-indigo-800 hover:bg-indigo-900 px-3 py-1 rounded text-xs transition">Keluar</button>
            </div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-md mx-auto w-full p-4 my-8">

        <!-- 1. BAGIAN AUTENTIKASI (LOGIN & REGISTER) -->
        <div id="authContainer" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <!-- Tab Navigasi Auth -->
            <div class="flex border-b border-slate-200 mb-6">
                <button id="tabLoginBtn" onclick="switchTab('login')" class="flex-1 pb-3 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition">Masuk (Login)</button>
                <button id="tabRegisterBtn" onclick="switchTab('register')" class="flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent transition">Daftar (Register)</button>
            </div>

            <!-- Form Login -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Username</label>
                    <input type="text" id="loginUsername" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Masuk</button>
            </form>

            <!-- Form Register -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Nama Lengkap</label>
                    <input type="text" id="regNama" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Username Baru</label>
                    <input type="text" id="regUsername" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                    <input type="password" id="regPassword" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" id="btnRegister" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg transition">Daftar Akun</button>
            </form>
        </div>

        <!-- 2. BAGIAN FORM LAPORAN (Tampil Setelah Login Berhasil) -->
        <div id="reportContainer" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hidden">
            <h2 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2">Form Input Laporan Kegiatan</h2>
            
            <form id="reportForm" onsubmit="handleSaveReport(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Kecamatan</label>
                    <input type="text" id="repKecamatan" placeholder="Contoh: Bulakamba / Losari" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Tujuan Kegiatan</label>
                    <input type="text" id="repTujuan" placeholder="Contoh: Supervisi Podes / Pemutakhiran" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Jadwal Pelaksanaan</label>
                    <input type="date" id="repJadwal" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Anggaran Biaya</label>
                        <input type="number" id="repAnggaranBiaya" value="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Anggaran Periksa</label>
                        <input type="number" id="repAnggaranPeriksa" value="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Urutan / Tahapan</label>
                    <input type="text" id="repUrutan" value="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Pejabat Terkait</label>
                    <input type="text" id="repPejabat" placeholder="Nama Pejabat Penanggung Jawab" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                
                <button type="submit" id="btnReport" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Simpan Laporan</button>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        &copy; 2026 Pengelolaan Data & Aplikasi • Sensus & Survei
    </footer>

    <!-- JavaScript Integrasi Web App -->
    <script>
        // URL Web App Google Apps Script yang disematkan
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCy_IgydmTURtBnRYO4hiixmH0aYvlOSoLmC4CicgKlfCySYxAy-Zq8IKXjSWr1_8/exec";

        // Variabel penampung sesi aktif di browser
        let currentUser = {
            username: "",
            nama_lengkap: ""
        };

        // Fungsi Ganti Tab (Login / Register)
        function switchTab(target) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');

            if (target === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLoginBtn.className = "flex-1 pb-3 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
                tabRegisterBtn.className = "flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegisterBtn.className = "flex-1 pb-3 text-center font-semibold text-emerald-600 border-b-2 border-emerald-600 transition";
                tabLoginBtn.className = "flex-1 pb-3 text-center font-semibold text-slate-400 border-b-2 border-transparent transition";
            }
        }

        // Fungsi Proses Login
        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const payload = {
                action: "login",
                username: document.getElementById('loginUsername').value,
                password: document.getElementById('loginPassword').value
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                // Karena menggunakan mode no-cors, respons detail dari Apps Script dibatasi browser.
                // Kita asumsikan input valid dan mencocokkan sesi secara lokal sementara.
                currentUser.username = payload.username;
                currentUser.nama_lengkap = payload.username; // Bisa disesuaikan jika server mengembalikan data
                
                alert("Login berhasil!");
                showReportDashboard();
            })
            .catch(err => {
                console.error(err);
                alert("Terjadi kendala jaringan saat login.");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Masuk";
            });
        }

        // Fungsi Proses Register
        function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btnRegister');
            btn.disabled = true;
            btn.innerText = "Mendaftarkan...";

            const payload = {
                action: "register",
                nama_lengkap: document.getElementById('regNama').value,
                username: document.getElementById('regUsername').value,
                password: document.getElementById('regPassword').value
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("Registrasi berhasil! Silakan masuk menggunakan akun baru Anda.");
                document.getElementById('registerForm').reset();
                switchTab('login');
            })
            .catch(err => {
                console.error(err);
                alert("Terjadi kendala saat registrasi.");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Daftar Akun";
            });
        }

        // Fungsi Simpan Laporan (Termasuk data Kecamatan)
        function handleSaveReport(e) {
            e.preventDefault();
            const btn = document.getElementById('btnReport');
            btn.disabled = true;
            btn.innerText = "Menyimpan Laporan...";

            const payload = {
                action: "save_report",
                username: currentUser.username,
                nama: currentUser.nama_lengkap,
                kecamatan: document.getElementById('repKecamatan').value, // Kolom Kecamatan
                tujuan: document.getElementById('repTujuan').value,
                jadwal: document.getElementById('repJadwal').value,
                anggaran_biaya: document.getElementById('repAnggaranBiaya').value,
                anggaran_periksa: document.getElementById('repAnggaranPeriksa').value,
                urutan: document.getElementById('repUrutan').value,
                pejabat: document.getElementById('repPejabat').value
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("Laporan kegiatan & data kecamatan berhasil disimpan ke Google Sheets!");
                document.getElementById('reportForm').reset();
            })
            .catch(err => {
                console.error(err);
                alert("Gagal mengirim laporan.");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Simpan Laporan";
            });
        }

        // Tampilkan Dashboard Utama setelah Login
        function showReportDashboard() {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('reportContainer').classList.remove('hidden');
            document.getElementById('userSession').classList.remove('hidden');
            document.getElementById('sessionName').innerText = currentUser.username;
        }

        // Fungsi Keluar / Logout
        function logout() {
            currentUser = { username: "", nama_lengkap: "" };
            document.getElementById('reportContainer').classList.add('hidden');
            document.getElementById('authContainer').classList.remove('hidden');
            document.getElementById('userSession').classList.add('hidden');
            document.getElementById('loginForm').reset();
        }
    </script>
</body>
</html>
